<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Will you be my Valentine?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Handschrift für den Brief -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffe6ee;
      --bg-soft: #ffeef5;
      --envelope-blue: #c7d4ff;
      --envelope-blue-dark: #9ab1ff;
      --envelope-stitch: #79a2c7;
      --heart-red: #cf2634;
      --heart-red-dark: #981621;
      --primary: #ff4b7d;
      --primary-dark: #e23564;
      --text-main: #3a262b;
      --text-muted: #8f6f79;
      --button-yes: #ff4b7d;
      --button-no: #ffffff;
      --shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff7fc 0, var(--bg) 55%, #ffc6da 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .card-shell {
      background: linear-gradient(145deg, #ffffff, var(--bg-soft));
      border-radius: 32px;
      padding: 36px 28px 26px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .card-shell::before {
      content: "";
      position: absolute;
      inset: -40%;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255, 192, 203, 0.45) 0, transparent 55%),
        radial-gradient(circle at 90% 80%, rgba(255, 105, 180, 0.45) 0, transparent 55%);
      opacity: 0.4;
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
    }

    .subtitle {
      font-size: 0.98rem;
      margin-bottom: 26px;
      color: var(--text-muted);
    }

    .envelope-wrapper {
      display: flex;
      justify-content: center;
      margin: 4px 0 26px;
      perspective: 1100px;
      position: relative;
    }

    /* Umschlag-Container */
    .envelope {
      width: 260px;
      height: 170px;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Umschlag Hintergrund: helles Blau mit Rahmen & „Naht“ */
    .envelope-base {
      position: absolute;
      inset: 0;
      background: var(--envelope-blue);
      border-radius: 20px;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .envelope-border {
      position: absolute;
      inset: 8px;
      border-radius: 16px;
      border: 2px solid rgba(121, 162, 199, 0.4);
      box-sizing: border-box;
    }

    .envelope-stitch {
      position: absolute;
      inset: 14px;
      border-radius: 14px;
      border: 2px dashed rgba(121, 162, 199, 0.8);
      box-sizing: border-box;
    }

    /* Innere Dreiecke */
    .envelope-flap-inner {
      position: absolute;
      inset: 14px;
    }

    .envelope-flap-inner::before,
    .envelope-flap-inner::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(145deg, var(--envelope-blue-dark), var(--envelope-blue));
    }

    .envelope-flap-inner::before {
      left: 0;
      clip-path: polygon(0 100%, 100% 100%, 0 0);
    }

    .envelope-flap-inner::after {
      right: 0;
      clip-path: polygon(0 100%, 100% 100%, 100% 0);
    }

    .envelope-bottom {
      position: absolute;
      inset: 14px;
      background: linear-gradient(180deg, var(--envelope-blue-dark), var(--envelope-blue));
      clip-path: polygon(0 100%, 50% 38%, 100% 100%);
    }

    /* Obere Lasche (Klappe) */
    .envelope-flap {
      position: absolute;
      inset: 14px;
      background: linear-gradient(180deg, var(--envelope-blue), var(--envelope-blue-dark));
      clip-path: polygon(0 0, 50% 60%, 100% 0);
      transform-origin: top center;
      transform: rotateX(0deg);
      transition: transform 0.85s cubic-bezier(0.21, 0.83, 0.28, 1.23);
      backface-visibility: hidden;
      z-index: 4;
    }

    /* Herzen IM Umschlag – im geschlossenen Zustand unsichtbar */
    .envelope-hearts {
      position: absolute;
      inset: 26px 24px 40px;
      overflow: visible;
      z-index: 2;
      opacity: 0;
      transform: translateY(8px) scale(0.9);
    }

    /* Wenn der Umschlag sich öffnet: kurz sichtbar, dann leicht nach oben raus */
    .envelope.open .envelope-hearts {
      animation: heartsPop 0.6s ease-out forwards;
    }

    @keyframes heartsPop {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(0.9);
      }
      40% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-10px) scale(1.05);
      }
    }


    .heart {
      position: absolute;
      width: 32px;
      height: 28px;
      transform: rotate(-45deg);
      background: var(--heart-red);
      border-radius: 8px 0 0 8px;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 32px;
      height: 28px;
      background: var(--heart-red);
      border-radius: 50%;
    }
    .heart::before {
      top: -14px;
      left: 0;
    }
    .heart::after {
      top: 0;
      left: 14px;
    }
    .heart--dark,
    .heart--dark::before,
    .heart--dark::after {
      background: var(--heart-red-dark);
    }

    /* Briefkarte – zieht sich langsam heraus */
    .val-card {
      position: absolute;
      left: 50%;
      top: 62%;
      width: 82%;
      height: 78%;
      background: #fffdf9;
      border-radius: 14px;
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.22);
      transform: translate(-50%, -10%);
      opacity: 0;
      transform-origin: bottom center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      transition:
        opacity 0.8s ease-out 0.9s,          /* erscheint mit leichter Verzögerung */
        transform 1.8s cubic-bezier(0.21, 0.9, 0.3, 1.18) 0.9s; /* langsam herausziehen */
      z-index: 3;
    }

    .val-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 10px;
      border: 1px dashed rgba(0, 0, 0, 0.06);
      pointer-events: none;
    }

    .val-card-main {
      position: relative;
      z-index: 1;
    }

    .val-card-main p {
      font-family: "Dancing Script", cursive;
      font-size: 1.8rem;
      line-height: 1.3;
      color: #d53362;
      margin-bottom: 4px;
    }

    .val-card-main span {
      display: block;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Buttons */
    .buttons-wrapper {
      position: relative;
      margin-top: 14px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      overflow: visible;
    }

    .btn {
      border: none;
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 999px;
      cursor: pointer;
      transition:
        box-shadow 0.13s ease-out,
        background 0.2s ease-out,
        color 0.2s ease-out;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-yes {
      background: linear-gradient(135deg, var(--button-yes), var(--primary-dark));
      color: #ffffff;
      font-weight: 700;
      min-width: 120px;

      /* WICHTIG */
      position: relative;
      z-index: 9999;              /* über allem */
      transform: scale(1);
      transform-origin: center;

      transition:
        transform 0.08s cubic-bezier(0.2, 1.4, 0.4, 1), /* extrem schnelles Wachstum */
        box-shadow 0.12s ease-out;
    }


    .btn-yes:hover {
      box-shadow: 0 10px 22px rgba(255, 75, 125, 0.5);
    }

    .btn-yes:active {
      box-shadow: 0 5px 12px rgba(255, 75, 125, 0.5);
    }

    .btn-no {
      background: var(--button-no);
      color: var(--text-main);
      border: 1px solid rgba(0, 0, 0, 0.08);
      position: relative; /* Start: im Layout */
      min-width: 96px;
      z-index: 5; /* bleibt über dem Card-Container sichtbar */
    }

    .btn-no:hover {
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    }

    .btn-no:active {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .hint {
      font-size: 0.8rem;
      margin-top: 12px;
      opacity: 0.6;
    }

    /* Zustand: Umschlag geöffnet */
    .envelope.open .envelope-flap {
      transform: rotateX(-190deg);
    }

    .envelope.open .val-card {
      opacity: 1;
      transform: translate(-50%, -96%);
    }

    /* Buttons & Untertitel ausblenden, wenn geantwortet */
    .answered .buttons-wrapper {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease-out;
    }

    .answered .subtitle {
      opacity: 0;
      transition: opacity 0.4s ease-out;
    }

    /* Fliegende Herzen, die vom Umschlag aus an einen Zielort fliegen und dann bleiben */
    .flying-heart {
      position: fixed;
      width: 24px;
      height: 21px;
      background: var(--heart-red);
      transform: rotate(-45deg) scale(0.4);
      border-radius: 7px 0 0 7px;
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.22));
      z-index: 0; /* hinter Umschlag/Karte */

      /* Animation passiert über Übergänge von top/left/transform/opacity */
      transition:
        top 1.5s ease-out,
        left 1.5s ease-out,
        transform 1.5s ease-out,
        opacity 0.8s ease-out;
    }

    .flying-heart::before,
    .flying-heart::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 21px;
      background: var(--heart-red);
      border-radius: 50%;
    }
    .flying-heart::before {
      top: -11px;
      left: 0;
    }
    .flying-heart::after {
      top: 0;
      left: 11px;
    }

    /* Zielzustand: an endgültiger Position sichtbar und etwas größer */
    .flying-heart.scatter {
      opacity: 1;
      transform: rotate(-45deg) scale(1);
    }


    /* Mobile Tweaks */
    @media (max-width: 520px) {
      h1 {
        font-size: 1.7rem;
      }

      .card-shell {
        padding: 28px 18px 22px;
      }

      .envelope {
        width: 230px;
        height: 155px;
      }

      .btn {
        padding: 9px 18px;
        font-size: 0.95rem;
      }

      .buttons-wrapper {
        height: 62px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="card-shell">
      <div class="card-inner">
        <h1>Will you be my Valentine?</h1>
        <p class="subtitle">There is only one correct answer…</p>

        <div class="envelope-wrapper" id="envelope-wrapper">
          <div class="envelope" id="envelope">
            <div class="envelope-base">
              <div class="envelope-border"></div>
              <div class="envelope-stitch"></div>

              <div class="envelope-flap-inner"></div>
              <div class="envelope-bottom"></div>

              <!-- optional interne Herzen, aber unsichtbar gestylt -->
              <div class="envelope-hearts">
                <div class="heart heart--dark"></div>
                <div class="heart"></div>
                <div class="heart heart--dark"></div>
                <div class="heart"></div>
                <div class="heart heart--dark"></div>
              </div>
            </div>

            <!-- obere Klappe -->
            <div class="envelope-flap"></div>

            <!-- Brief -->
            <div class="val-card" id="val-card">
              <div class="val-card-main">
                <p>You are my Valentine</p>
                <span>Now you&apos;re officially stuck with me.</span>
              </div>
            </div>
          </div>
        </div>

        <div class="buttons-wrapper" id="buttons-wrapper">
          <button class="btn btn-yes" id="btn-yes">
            Yes
          </button>
          <button class="btn btn-no" id="btn-no">
            No
          </button>
        </div>

        <p class="hint">(Good luck trying to press "No"…)</p>
      </div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("btn-yes");
    const noBtn = document.getElementById("btn-no");
    const envelope = document.getElementById("envelope");
    const buttonsWrapper = document.getElementById("buttons-wrapper");
    const envelopeWrapper = document.getElementById("envelope-wrapper");

    let hasAnswered = false;
    let yesScale = 1;

    function growYes() {
      // brutal schnelles Wachstum
      yesScale = Math.min(3.5, yesScale + 0.45); // bis 350 %
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    yesBtn.style.boxShadow = `0 20px 60px rgba(255, 75, 125, ${0.3 + yesScale * 0.1})`;


    // No-Button darf sich über die gesamte Seite bewegen
    function moveNoButton() {
      growYes();

      const noRect = noBtn.getBoundingClientRect();
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;

      noBtn.style.position = "fixed";

      const margin = 10;
      const maxLeft = viewportWidth - noRect.width - margin;
      const maxTop = viewportHeight - noRect.height - margin;

      const newLeft = margin + Math.random() * Math.max(0, maxLeft);
      const newTop = margin + Math.random() * Math.max(0, maxTop);

      noBtn.style.left = `${newLeft}px`;
      noBtn.style.top = `${newTop}px`;
    }

    // Herzen erzeugen, die sich um den Umschlag herum verteilen und bleiben
    function releaseHearts() {
      const envelopeRect = envelopeWrapper.getBoundingClientRect();

      // Startpunkt: Öffnung des Umschlags (ungefähr obere Mitte)
      const startX = envelopeRect.left + envelopeRect.width / 2;
      const startY = envelopeRect.top + envelopeRect.height * 0.30;

      const count = 20;

      for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.className = "flying-heart";

        // Start: direkt an der Umschlagöffnung
        heart.style.left = `${startX}px`;
        heart.style.top = `${startY}px`;

        document.body.appendChild(heart);

        // Zielposition irgendwo auf der Seite
        const margin = 20;
        const targetX = margin + Math.random() * Math.max(0, window.innerWidth - 2 * margin - 24);
        const targetY = margin + Math.random() * Math.max(0, window.innerHeight - 2 * margin - 24);

        // im nächsten Frame Ziel + scatter setzen, damit Transition greift
        setTimeout(() => {
          heart.classList.add("scatter");
          heart.style.left = `${targetX}px`;
          heart.style.top = `${targetY}px`;
        }, 20 + Math.random() * 250); // kleine zufällige Verzögerung → organischer
      }
    }

    // Desktop: bei Hover / Annäherung wegspringen
    noBtn.addEventListener("mouseenter", () => {
      if (hasAnswered) return;
      moveNoButton();
    });

    // Touch-Geräte: bei Touchstart wegspringen
    noBtn.addEventListener("touchstart", (e) => {
      if (hasAnswered) return;
      e.preventDefault();
      moveNoButton();
    }, { passive: false });

    // Klick auf "Yes"
    yesBtn.addEventListener("click", () => {
      if (hasAnswered) return;
      hasAnswered = true;

      // Yes zurück auf Normalgröße
      yesScale = 1;
      yesBtn.style.transform = "scale(1)";

      document.body.classList.add("answered");

      // 1) Umschlag öffnen → Klappe + Innenherzen-Animation
      envelope.classList.add("open");

      // 2) Mit kleinem Delay die fliegenden Herzen starten
      setTimeout(() => {
        releaseHearts();
      }, 250); // 0.25s nach Klappen-Start
    });


    // "No" darf nie wirklich geklickt werden
    noBtn.addEventListener("click", (e) => {
      e.preventDefault();
      if (hasAnswered) return;
      moveNoButton();
    });
  </script>
</body>
</html>
